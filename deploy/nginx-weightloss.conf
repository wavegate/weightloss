# Amazon Linux: copy to /etc/nginx/conf.d/weightloss.conf
#   sudo cp deploy/nginx-weightloss.conf /etc/nginx/conf.d/weightloss.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS (grey cloud / DNS only): api.webdevfrank.com -> EC2 public IP
# Uvicorn must listen on 127.0.0.1:8000 (see deploy/weightloss-api.service)
#
# Then issue TLS:
#   sudo dnf install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.webdevfrank.com

server {
    listen 80;
    server_name api.webdevfrank.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Coach AG-UI streams events; disable buffering and use long timeouts.
    location /copilotkit/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
